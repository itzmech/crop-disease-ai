<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-label="Stylized crop leaf being scanned by a computer-vision model">
  <defs>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9e5f"/>
      <stop offset=".55" stop-color="#1d5a38"/>
      <stop offset="1" stop-color="#10301f"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2718"/>
      <stop offset="1" stop-color="#07130d"/>
    </linearGradient>
    <radialGradient id="spotWarm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#e07b39" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e07b39" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotCool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7dd3a1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7dd3a1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Backdrop panel -->
  <rect x="1" y="1" width="518" height="378" rx="22" fill="url(#bgGrad)" stroke="#2a4a38" stroke-width="1.5"/>

  <!-- Faint grid -->
  <g stroke="#7dd3a1" stroke-opacity=".07">
    <path d="M65 0V380M130 0V380M195 0V380M260 0V380M325 0V380M390 0V380M455 0V380"/>
    <path d="M0 63H520M0 126H520M0 189H520M0 252H520M0 315H520"/>
  </g>

  <!-- Ground line + stem -->
  <path d="M120 330 C 190 300, 250 290, 330 300" stroke="#2a4a38" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Leaf -->
  <g transform="translate(96,74) rotate(-6 160 130)">
    <path d="M160 8 C 96 30, 34 88, 30 158 C 27 216, 62 258, 116 272 C 132 236, 158 214, 196 204
             C 234 194, 262 166, 270 128 C 278 88, 258 44, 222 24 C 204 14, 182 8, 160 8 Z"
          fill="url(#leafGrad)" stroke="#43b973" stroke-width="2.5"/>
    <path d="M150 260 C 150 200, 156 120, 196 40" stroke="#0a1f15" stroke-opacity=".55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g stroke="#0a1f15" stroke-opacity=".28" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M162 236 C 176 214, 190 198, 208 186"/>
      <path d="M156 196 C 176 182, 196 172, 218 166"/>
      <path d="M148 156 C 170 148, 192 144, 216 142"/>
      <path d="M134 118 C 158 112, 182 110, 206 112"/>
      <path d="M118 84 C 142 74, 166 68, 190 66"/>
    </g>

    <!-- Lesion spots (target regions) -->
    <circle cx="118" cy="196" r="26" fill="url(#spotWarm)"/>
    <circle cx="118" cy="196" r="13" fill="#c96a2d" fill-opacity=".85"/>
    <circle cx="208" cy="120" r="20" fill="url(#spotWarm)"/>
    <circle cx="208" cy="120" r="9" fill="#c96a2d" fill-opacity=".8"/>
    <circle cx="86" cy="128" r="14" fill="url(#spotCool)"/>
  </g>

  <!-- Detection ring on main lesion -->
  <g transform="translate(214,270)">
    <circle r="34" fill="none" stroke="#e8a33d" stroke-width="2.5" stroke-dasharray="5 6" opacity=".9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bounding box + label -->
  <g>
    <rect x="286" y="98" width="120" height="86" rx="10" fill="#07130d" fill-opacity=".55" stroke="#43b973" stroke-width="1.6"/>
    <g stroke="#43b973" stroke-width="2" stroke-linecap="round">
      <path d="M286 112 v-8 a8 8 0 0 1 8 -8 h12" fill="none"/>
      <path d="M406 98 h12 a8 8 0 0 1 8 8 v12" fill="none" transform="translate(0,0)"/>
    </g>
    <text x="300" y="126" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#7dd3a1">leaf.region</text>
    <text x="300" y="146" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#b7e6c9">feature_map_16</text>
    <text x="300" y="164" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#6f8f7d">grad*act → cam</text>
  </g>

  <!-- Confidence chip -->
  <g>
    <rect x="330" y="232" width="150" height="44" rx="12" fill="#07130d" fill-opacity=".72" stroke="#2f9e5f" stroke-width="1.4"/>
    <text x="346" y="250" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#b7e6c9">model.output</text>
    <text x="346" y="266" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#eafff2">softmax → class</text>
  </g>

  <!-- Severity mini-meter -->
  <g>
    <rect x="60" y="300" width="150" height="40" rx="12" fill="#07130d" fill-opacity=".72" stroke="#b08968" stroke-width="1.3"/>
    <rect x="76" y="314" width="118" height="10" rx="5" fill="#2a241c"/>
    <rect x="76" y="314" width="40" height="10" rx="5" fill="#e8a33d"/>
    <text x="76" y="336" font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#c9b39a">affected-area estimate</text>
  </g>
</svg>
